# Adds namespace to all resources.
namespace: model-registry-operator-system

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
namePrefix: model-registry-operator-

# Labels to add to all resources and selectors.
#labels:
#- includeSelectors: true
#  pairs:
#    someName: someValue

# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix including the one in
# crd/kustomization.yaml
# [CERTMANAGER] To enable cert-manager, uncomment all sections with 'CERTMANAGER'. 'WEBHOOK' components are required.
#- ../certmanager
# [PROMETHEUS] To enable prometheus monitor, uncomment all sections with 'PROMETHEUS'.
resources:
- ../crd
- ../rbac
- ../manager
#- ../jobs-async-upload
#- ../webhook
#- ../prometheus

# Workload permissions belong to the registry namespace. The RoleBinding's
# ServiceAccount subject stays in the separate controller namespace.
replacements:
- source:
    kind: ServiceAccount
    name: controller-manager
    fieldPath: metadata.name
  targets:
  - select:
      kind: RoleBinding
      name: registry-rolebinding
    fieldPaths:
    - subjects.[kind=ServiceAccount].name
- source:
    kind: ServiceAccount
    name: controller-manager
    fieldPath: metadata.namespace
  targets:
  - select:
      kind: RoleBinding
      name: registry-rolebinding
    fieldPaths:
    - subjects.[kind=ServiceAccount].namespace
- source:
    kind: Deployment
    name: controller-manager
    fieldPath: spec.template.spec.containers.[name=manager].env.[name=REGISTRIES_NAMESPACE].value
  targets:
  - select:
      kind: Role
      name: manager-role
    fieldPaths:
    - metadata.namespace
  - select:
      kind: RoleBinding
      name: registry-rolebinding
    fieldPaths:
    - metadata.namespace

# Protect the /metrics endpoint by putting it behind auth.
# If you want your controller-manager to expose the /metrics
# endpoint w/o any authn/z, please comment the following line.



# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix including the one in
# crd/kustomization.yaml
patches:
  - path: manager_auth_proxy_patch.yaml
#- manager_webhook_patch.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
